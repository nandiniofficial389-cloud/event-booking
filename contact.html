<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowGo!</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1C1C1C;
            color: white;
        } 
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 5px 5px 5px;
            background-color: black;
            height: 60px;
        }
        .logo img {
            left: 30px;
            height: 100px;
            width: 150px;
        }
        .links a {
            color: #EAEAEA;
            gap: 40px;
            margin: 5px 5px 5px 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .links a:hover {
            color: #FFD700;
        } 
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height:650px;
            width: 500px;
            border: 1px solid rgba(0,0,0,0.5);
            box-shadow: inset 0 0 10px rgba(1, 1, 1, 0.5);
            border-radius: 30px;
            margin: 30px auto;
             
        }
        .query {
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
            height:400px;
            width: 300px;
            border: 1px solid rgba(0,0,0,0.5);
            box-shadow: inset 0 6px 15px rgba(204, 187, 215, 0.5);
            border-radius: 30px;
            margin: 40px auto;
            padding: 20px; 
        }
        h4{
            text-align: center;
            color: #EAEAEA;
        }
        label{
            color: #EAEAEA;
        }
        input,textarea{
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.5);
            background-color: #333;
            color: #EAEAEA;
        }
        .submit-btn {
            background-color: #998080;
            color: #EAEAEA;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        @media(max-width: 600px) {
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                height:550px;
                width: 400px;
                border: 1px solid rgba(0,0,0,0.5);
                box-shadow: inset 0 0 10px rgba(1, 1, 1, 0.5);
                border-radius: 30px;
                margin: 70px auto;
            }
            .query {
                display: flex;
                flex-direction: column;
                width: 100%;
                box-sizing: border-box;
                height:400px;
                width: 300px;
                border: 1px solid rgba(0,0,0,0.5);
                box-shadow: inset 0 6px 15px rgba(204, 187, 215, 0.5);
                border-radius: 30px;
                margin: 40px auto;
                padding: 20px; 
            }
            h4{
                text-align: center;
                color: #EAEAEA;
            }
            label{
                color: #EAEAEA;
            }
            input,textarea{
                padding: 10px;
                border-radius: 10px;
                border: 1px solid rgba(0,0,0,0.5);
                background-color: #333;
                color: #EAEAEA;
            }
            .submit-btn {
                background-color: #998080;
                color: #EAEAEA;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                margin-top: 10px;
            }
        }
        @media(max-width: 400px) {
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                height:550px;
                width: 400px;
                border: 1px solid rgba(0,0,0,0.5);
                box-shadow: inset 0 0 10px rgba(1, 1, 1, 0.5);
                border-radius: 30px;
                margin: 40px auto;
            }
            .query {
                display: flex;
                flex-direction: column;
                width: 100%;
                box-sizing: border-box;
                height:400px;
                width: 300px;
                border: 1px solid rgba(0,0,0,0.5);
                box-shadow: inset 0 6px 15px rgba(204, 187, 215, 0.5);
                border-radius: 30px;
                margin: 40px auto;
                padding: 20px; 
            }
            h4{
                text-align: center;
                color: #EAEAEA;
            }
            label{
                color: #EAEAEA;
            }
            input,textarea{
                padding: 10px;
                border-radius: 10px;
                border: 1px solid rgba(0,0,0,0.5);
                background-color: #333;
                color: #EAEAEA;
            }
            .submit-btn {
                background-color: #998080;
                color: #EAEAEA;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                margin-top: 10px;
            }
        }    
    </style>
</head>
<body>
    <nav>
    <div class="logo">
      <img src="white.png" alt="logo">
    </div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="event.html">Events</a>
      <a href="form.html">Book</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
  <div class="container">
    <h2><i>Contact Us</i></h2>
    <form class="query">
        <h4>Drop Your <strong><i>Query</i></strong></h4>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required><br>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br>
      
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" minlength="10" maxlength="400" required></textarea><br>
      
      <button type="submit" class="submit-btn">Submit Query</button>
    </form>
  </div>
</body>
</html>
